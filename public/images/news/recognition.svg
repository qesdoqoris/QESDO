<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t">
  <title id="t">Illustration of an award medal with laurel leaves</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a3f8f"/>
      <stop offset="1" stop-color="#2a5bb5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e0a52e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- rays -->
  <g fill="#5bb4e8" opacity="0.18" transform="translate(400 215)">
    <path d="M0 0 L-40 -260 L40 -260Z"/><path d="M0 0 L-40 -260 L40 -260Z" transform="rotate(30)"/>
    <path d="M0 0 L-40 -260 L40 -260Z" transform="rotate(60)"/><path d="M0 0 L-40 -260 L40 -260Z" transform="rotate(90)"/>
    <path d="M0 0 L-40 -260 L40 -260Z" transform="rotate(-30)"/><path d="M0 0 L-40 -260 L40 -260Z" transform="rotate(-60)"/>
    <path d="M0 0 L-40 -260 L40 -260Z" transform="rotate(-90)"/>
  </g>
  <!-- ribbon -->
  <path d="M360 40 L400 140 L440 40 L470 40 L425 150 L375 150 L330 40Z" fill="#5bb4e8"/>
  <path d="M345 40 L385 150 L400 140 L360 40Z" fill="#8ccbf0"/>
  <!-- laurels -->
  <g fill="#8ccbf0">
    <g transform="translate(400 225)">
      <ellipse cx="-118" cy="40" rx="10" ry="22" transform="rotate(-40 -118 40)"/>
      <ellipse cx="-130" cy="5" rx="10" ry="22" transform="rotate(-15 -130 5)"/>
      <ellipse cx="-128" cy="-32" rx="10" ry="22" transform="rotate(10 -128 -32)"/>
      <ellipse cx="-112" cy="-66" rx="10" ry="22" transform="rotate(35 -112 -66)"/>
      <ellipse cx="118" cy="40" rx="10" ry="22" transform="rotate(40 118 40)"/>
      <ellipse cx="130" cy="5" rx="10" ry="22" transform="rotate(15 130 5)"/>
      <ellipse cx="128" cy="-32" rx="10" ry="22" transform="rotate(-10 128 -32)"/>
      <ellipse cx="112" cy="-66" rx="10" ry="22" transform="rotate(-35 112 -66)"/>
    </g>
  </g>
  <!-- medal -->
  <circle cx="400" cy="225" r="88" fill="url(#gold)" stroke="#ffffff" stroke-width="6"/>
  <circle cx="400" cy="225" r="66" fill="none" stroke="#b9831f" stroke-width="3"/>
  <path d="M400 180 L413 210 L446 212 L421 233 L429 265 L400 248 L371 265 L379 233 L354 212 L387 210Z" fill="#ffffff"/>
  <!-- confetti -->
  <g opacity="0.8">
    <rect x="140" y="90" width="12" height="6" fill="#ffd27a" transform="rotate(25 146 93)"/>
    <rect x="220" y="300" width="12" height="6" fill="#8ccbf0" transform="rotate(-20 226 303)"/>
    <rect x="610" y="110" width="12" height="6" fill="#8ccbf0" transform="rotate(40 616 113)"/>
    <rect x="660" y="290" width="12" height="6" fill="#ffd27a" transform="rotate(-35 666 293)"/>
    <circle cx="180" cy="200" r="5" fill="#ffffff"/><circle cx="630" cy="200" r="5" fill="#ffffff"/>
    <circle cx="560" cy="60" r="4" fill="#ffd27a"/><circle cx="250" cy="60" r="4" fill="#ffd27a"/>
  </g>
</svg>
